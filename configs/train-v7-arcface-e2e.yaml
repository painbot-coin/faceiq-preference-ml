# ArcFace R50 end-to-end fine-tune — run if v6 probe shows strong signal.
# Lower lr + smaller batch: backbone already face-tuned on WebFace600K.
# Run: python scripts/train.py --config configs/train-v7-arcface-e2e.yaml

export_dir: data/exports/cmr1mr0m7000196d57zi3vcgn
run_name: train-v7-arcface-e2e

backbone: arcface_r50
freeze_backbone: false
image_size: 112
batch_size: 32
epochs: 8
lr: 0.00001                 # 1e-5 — gentle fine-tune on pretrained face weights
weight_decay: 0.0001

val_fraction: 0.2
split_seed: 42
num_workers: 4
skip_ties: true
augment: true
