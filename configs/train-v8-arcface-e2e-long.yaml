# ArcFace R50 e2e, extended — v7 was still improving at its final epoch (8/8),
# so the only change vs v7 is epochs 8 -> 16. best.pt keeps the peak epoch.
# Run: python scripts/train.py --config configs/train-v8-arcface-e2e-long.yaml

export_dir: data/exports/cmr1mr0m7000196d57zi3vcgn
run_name: train-v8-arcface-e2e-long

backbone: arcface_r50
freeze_backbone: false
image_size: 112
batch_size: 32
epochs: 16
lr: 0.00001
weight_decay: 0.0001

val_fraction: 0.2
split_seed: 42
num_workers: 4
skip_ties: true
augment: true
