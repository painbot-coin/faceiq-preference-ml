# Preference comparator v2 — cheap improvements over v1 baseline
# Changes vs v1: resnet50 backbone, weight_decay 1e-4 -> 5e-4 (v1 overfit after
# epoch 7), epochs 10 -> 8 (v1 val accuracy peaked at epoch 7).
# Run: python scripts/train.py --config configs/train-v2.yaml

export_dir: data/exports/cmr1mr0m7000196d57zi3vcgn
run_name: train-v2

backbone: resnet50
image_size: 224
batch_size: 64
epochs: 8
lr: 0.0001
weight_decay: 0.0005

val_fraction: 0.2           # split by FACE id, never by pair
split_seed: 42
num_workers: 4
skip_ties: true
augment: true
