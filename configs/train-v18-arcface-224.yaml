# ❌ DOES NOT RUN. Kept as the record of why, because the reason is a real constraint.
#
#   RuntimeError: mat1 and mat2 shapes cannot be multiplied (32x100352 and 25088x512)
#
# ArcFace w600k_r50 arrives as an ONNX graph converted whole by onnx2torch, and its final layer is
# a fixed `Linear(25088, 512)` — that is 512 channels x 7 x 7, the feature map a 112px input
# produces. At 224px the map is 14 x 14, so the flatten emits 100,352 features and the head
# rejects them. **ArcFace is hard-wired to 112px** and no config change reaches that.
#
# The two ways out, and why neither is used here:
#
#   * Insert AdaptiveAvgPool2d((7,7)) before the flatten. Fits the head, but averages each 2x2
#     block — which discards exactly the extra detail the experiment exists to test. Pointless.
#   * Replace the final Linear with a fresh Linear(100352, 512). Legitimate (the conv trunk is
#     the bulk of the pretrained value) but it discards a pretrained layer, so a null result
#     would be unreadable: pretrained-head-loss and resolution would be confounded.
#
# The test moved to a matched pair on a backbone that natively takes any input size:
# `train-v20-resnet50-112` and `train-v21-resnet50-224`, identical except image_size. resnet50 is
# a weaker backbone than ArcFace in absolute terms (75.4% vs 78.4% against VLM labels in the
# v1-v10 sweep), so those arms cannot be compared to the ArcFace arms — but they CAN be compared
# to each other, which is the only comparison the resolution question needs.
#
# Worth knowing before reading that result: the source photos are **1024 x 1024**, so training at
# 112px uses about 1.2% of the available pixels. There is real detail being discarded.

export_dir: data/exports/cmr1mr0m7000196d57zi3vcgn
run_name: train-v18-arcface-224

backbone: arcface_r50
freeze_backbone: false
image_size: 224          # <- incompatible with arcface_r50; see the note above
batch_size: 32
epochs: 10
lr: 0.00001
weight_decay: 0.0001

val_fraction: 0.5
split_seed: 42
num_workers: 4
skip_ties: true
augment: true

panel_labels:
  - [labels/panel-pilot/results, labels/panel-pilot/sample-meta.json]
  - [labels/panel-run-3/results, labels/panel-run-3/sample-meta.json]
  - [labels/panel-run-4-random/results, labels/panel-run-4-random/sample-meta.json]
panel_rejects:
  - artifacts/panel-run-v1/reject-pids.txt
  - artifacts/panel-run-v3/reject-pids.txt
  - artifacts/panel-run-v4/reject-pids.txt
panel_min_votes: 4
panel_prior: 1.0
panel_hard: false
