# ArcFace e2e — train on high-confidence VLM pairs only (human labels always kept).
# Val set unchanged (full 2,068 pairs) so accuracy is comparable across runs.
# Based on v7 recipe; addresses label noise on medium-confidence close matchups.
# Run: python scripts/train.py --config configs/train-v9-arcface-highconf.yaml

export_dir: data/exports/cmr1mr0m7000196d57zi3vcgn
run_name: train-v9-arcface-highconf

backbone: arcface_r50
freeze_backbone: false
confidence_filter: high
image_size: 112
batch_size: 32
epochs: 8
lr: 0.00001
weight_decay: 0.0001

val_fraction: 0.2
split_seed: 42
num_workers: 4
skip_ties: true
augment: true
