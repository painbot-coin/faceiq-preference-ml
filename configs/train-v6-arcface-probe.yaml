# ArcFace R50 embedding probe (Harsh's face-specific backbone suggestion).
# InsightFace buffalo_l w600k_r50 — frozen 512-dim face embeddings + trainable head.
# Run: pip install -e ".[arcface]"  (first time only)
#      python scripts/train.py --config configs/train-v6-arcface-probe.yaml

export_dir: data/exports/cmr1mr0m7000196d57zi3vcgn
run_name: train-v6-arcface-probe

backbone: arcface_r50
freeze_backbone: true
image_size: 112             # ArcFace native input size
batch_size: 64
epochs: 10
lr: 0.001                   # head-only (same recipe as v3 DINOv2 probe)
weight_decay: 0.0001

val_fraction: 0.2
split_seed: 42
num_workers: 4
skip_ties: true
augment: true
